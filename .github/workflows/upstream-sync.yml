name: Upstream sync and release

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact anomalyco/opencode commit SHA (40 hex). Empty resolves dev."
        required: false
      publish:
        description: "Publish a release after all gates pass"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync, verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns jq
          podman --version

      - name: Resolve upstream SHA
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="${INPUT_SHA}"
          if [[ -z "${sha}" ]]; then
            sha="$(git ls-remote https://github.com/anomalyco/opencode.git refs/heads/dev | cut -f1)"
          fi
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: not a full upstream SHA: ${sha}" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved anomalyco/opencode dev: ${sha}"

      - name: Compare with last published release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
            | grep -E '^zoc-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V > /tmp/release-tags.txt || true
          latest="$(tail -n 1 /tmp/release-tags.txt || true)"
          version="0.1.0"
          previous_sha=""
          if [[ -n "${latest}" ]]; then
            previous_version="${latest#zoc-v}"
            version="$(python3 - "${previous_version}" <<'PY'
import sys
parts = [int(x) for x in sys.argv[1].split(".")]
parts[2] += 1
print(".".join(map(str, parts)))
PY
)"
            mkdir -p /tmp/last-release
            if gh release download "${latest}" --pattern upstream.json --dir /tmp/last-release --clobber 2>/dev/null; then
              previous_sha="$(jq -r '.upstreamCommit // ""' /tmp/last-release/upstream.json)"
            fi
          fi
          # Never reuse a tag: pick the first unused patch version.
          while git rev-parse -q --verify "refs/tags/zoc-v${version}" >/dev/null; do
            version="$(python3 - "${version}" <<'PY'
import sys
parts = [int(x) for x in sys.argv[1].split(".")]
parts[2] += 1
print(".".join(map(str, parts)))
PY
)"
          done
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous_sha=${previous_sha}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${latest}" >> "$GITHUB_OUTPUT"
          echo "Previous upstream: ${previous_sha:-none}; next ZOC version: ${version}"
          if [[ "${previous_sha}" == "${UPSTREAM_SHA}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do
        if: steps.previous.outputs.changed != 'true'
        run: echo "Upstream dev is unchanged at ${{ steps.upstream.outputs.sha }}; no release."

      - name: Build pinned toolchain image
        if: steps.previous.outputs.changed == 'true'
        run: podman build --pull=missing -f Containerfile -t localhost/zoc-build:2026-11-16 .

      - name: Run gates
        if: steps.previous.outputs.changed == 'true'
        env:
          ZOC_VERSION: ${{ steps.previous.outputs.version }}
          ZOC_UPSTREAM_COMMIT: ${{ steps.upstream.outputs.sha }}
          ZOC_UPDATER_PUBLIC_KEY: ${{ vars.ZOC_UPDATER_PUBLIC_KEY }}
        run: ./scripts/container.sh ./scripts/check.sh

      - name: Build Linux artifact
        if: steps.previous.outputs.changed == 'true'
        env:
          ZOC_VERSION: ${{ steps.previous.outputs.version }}
          ZOC_UPSTREAM_COMMIT: ${{ steps.upstream.outputs.sha }}
          ZOC_UPDATER_PUBLIC_KEY: ${{ vars.ZOC_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: ./scripts/container.sh ./scripts/build.sh

      - name: WebKitGTK smoke
        if: steps.previous.outputs.changed == 'true'
        env:
          ZOC_VERSION: ${{ steps.previous.outputs.version }}
        run: ./scripts/container.sh ./scripts/smoke.sh

      - name: Generate release notes
        if: steps.previous.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ZOC_VERSION: ${{ steps.previous.outputs.version }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.previous_sha }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.latest_tag }}
        run: ./scripts/release-notes.sh > /tmp/release-notes.md

      - name: Verify updater metadata
        if: steps.previous.outputs.changed == 'true'
        env:
          ZOC_UPDATER_PUBLIC_KEY: ${{ vars.ZOC_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [[ -n "${ZOC_UPDATER_PUBLIC_KEY}" && -n "${MYGO_UPDATER_PRIVATE_KEY}" ]]; then
            test -f build/linux-amd64/update-linux-amd64.json || {
              echo "error: signed update manifest is missing" >&2; exit 1;
            }
          else
            echo "Signed in-app updates are not provisioned; publishing plain artifacts only."
          fi

      - name: Publish release
        if: steps.previous.outputs.changed == 'true' && (inputs.publish == true || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.previous.outputs.version }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          tag="zoc-v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "error: tag ${tag} already exists" >&2
            exit 1
          fi
          git tag -a "${tag}" -m "ZOC ${VERSION} (OpenCode ${UPSTREAM_SHA})"
          git push origin "${tag}"
          mapfile -t assets < <(find build/linux-amd64 -maxdepth 1 -type f ! -name zoc ! -name .mygo-files -printf '%p\n' | sort)
          gh release create "${tag}" "${assets[@]}" \
            --title "ZOC ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
          echo "Published ${tag}"

      - name: Dry-run summary
        if: steps.previous.outputs.changed == 'true' && inputs.publish != true && github.event_name != 'schedule'
        run: |
          echo "Gates passed; no release was published (publish=false)."
          cat build/linux-amd64/upstream.json
